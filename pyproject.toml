[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lark-a2-cli"
version = "0.1.0"
description = "Read and control a Hollyland LARK A2 USB-C receiver over HID"
requires-python = ">=3.10"
dependencies = ["hidapi>=0.14,<1"]

[project.scripts]
lark = "lark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
