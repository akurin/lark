name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install CLI and run tests
        run: |
          bash -n scripts/install.sh scripts/install-helper.sh scripts/uninstall.sh
          ./scripts/install.sh
          .venv/bin/python -m unittest discover -s tests -v
          (cd /tmp && "$HOME/.local/bin/lark" --help)

      - name: Build and verify macOS helper
        run: |
          ./scripts/install-helper.sh
          ./scripts/install-helper.sh
          codesign --verify --deep --strict "$HOME/Applications/Lark Helper.app"
