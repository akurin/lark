name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test and install
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh
          go test ./...
          ./scripts/install.sh
          ./scripts/install.sh
          codesign --verify --deep --strict "$HOME/Applications/Lark Helper.app"
          (cd /tmp && "$HOME/.local/bin/lark" --help)
